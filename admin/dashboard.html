<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .dashboard-header h1 {
            color: var(--text-primary);
        }

        .create-btn {
            padding: 0.8rem 1.5rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
        }

        .create-btn:hover {
            background: var(--accent-hover);
        }

        .blog-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .blog-table th,
        .blog-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .blog-table th {
            background: var(--bg-secondary);
            font-weight: 600;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.5rem;
            font-size: 0.9rem;
            color: #fff;
        }

        .edit-btn {
            background: var(--accent);
        }

        .edit-btn:hover {
            background: var(--accent-hover);
        }

        .delete-btn {
            background: #ff4d4d;
        }

        .delete-btn:hover {
            background: #ff3333;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: var(--card-bg);
            border-color: var(--accent);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }

        .modal-content {
            position: relative;
            background: var(--card-bg);
            margin: 2rem auto;
            padding: 2rem;
            max-width: 800px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .modal-content h2 {
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea {
            height: 200px;
            resize: vertical;
        }

        .save-btn {
            padding: 0.8rem 1.5rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .save-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Tech Blog</div>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pages/blogs.html">Blogs</a></li>
                <li><button id="logout-btn" class="logout-btn">Logout</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="dashboard">
            <div class="dashboard-header">
                <h1>Blog Management</h1>
                <button class="create-btn" onclick="openModal()">Create New Blog</button>
            </div>

            <table class="blog-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="blog-list">
                    <!-- Blog list will be loaded here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Blog Modal -->
    <div id="blog-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Create New Blog</h2>
            <form id="blog-form">
                <input type="hidden" id="blog-id">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="url" id="image" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" required></textarea>
                </div>
                <button type="submit" class="save-btn">Save Blog</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Tech Blog. All rights reserved.</p>
    </footer>

    <script>
        // Check authentication
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }

        // Load blogs
        function loadBlogs() {
            const blogs = JSON.parse(localStorage.getItem('blogs')) || [];
            const blogList = document.getElementById('blog-list');
            
            blogList.innerHTML = blogs.map(blog => `
                <tr>
                    <td>${blog.title}</td>
                    <td>${new Date(blog.date).toLocaleDateString()}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editBlog('${blog.id}')">Edit</button>
                        <button class="action-btn delete-btn" onclick="deleteBlog('${blog.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // Modal functions
        function openModal() {
            document.getElementById('modal-title').textContent = 'Create New Blog';
            document.getElementById('blog-form').reset();
            document.getElementById('blog-id').value = '';
            document.getElementById('blog-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('blog-modal').style.display = 'none';
        }

        // Edit blog
        function editBlog(id) {
            const blogs = JSON.parse(localStorage.getItem('blogs')) || [];
            const blog = blogs.find(b => b.id === id);
            
            if (blog) {
                document.getElementById('modal-title').textContent = 'Edit Blog';
                document.getElementById('blog-id').value = blog.id;
                document.getElementById('title').value = blog.title;
                document.getElementById('image').value = blog.image || '';
                document.getElementById('content').value = blog.content;
                document.getElementById('blog-modal').style.display = 'block';
            }
        }

        // Delete blog
        function deleteBlog(id) {
            if (confirm('Are you sure you want to delete this blog?')) {
                const blogs = JSON.parse(localStorage.getItem('blogs')) || [];
                const filteredBlogs = blogs.filter(blog => blog.id !== id);
                localStorage.setItem('blogs', JSON.stringify(filteredBlogs));
                loadBlogs();
            }
        }

        // Handle form submission
        document.getElementById('blog-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const blogId = document.getElementById('blog-id').value;
            const title = document.getElementById('title').value;
            const image = document.getElementById('image').value;
            const content = document.getElementById('content').value;
            
            const blogs = JSON.parse(localStorage.getItem('blogs')) || [];

            if (blogId) {
                // Update existing blog
                const index = blogs.findIndex(blog => blog.id === blogId);
                if (index !== -1) {
                    blogs[index] = {
                        ...blogs[index],
                        title,
                        image,
                        content,
                        lastModified: new Date().toISOString()
                    };
                }
            } else {
                // Create new blog
                blogs.push({
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                    title,
                    image,
                    content,
                    date: new Date().toISOString()
                });
            }

            localStorage.setItem('blogs', JSON.stringify(blogs));
            loadBlogs();
            closeModal();
        });

        // Handle logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'login.html';
        });

        // Close modal when clicking outside
        window.onclick = (event) => {
            const modal = document.getElementById('blog-modal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Load blogs when page loads
        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
